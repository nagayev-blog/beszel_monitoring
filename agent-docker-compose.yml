version: "3.9"

services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent-send-to-${HUB_DNS}
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel_agent_data:/var/lib/beszel-agent
    environment:
      - KEY=${BESZEL_KEY}
      - TOKEN=${BESZEL_TOKEN}
      - HUB_URL=https://${HUB_DNS}

volumes:
  beszel_agent_data:
